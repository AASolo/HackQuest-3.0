<script>
const D={"tasks": [{"lvl": "EASY", "title": "Первый контакт", "desc": "Ты, GHOST, у порога сети NEXUS. Выведи три строки (каждая отдельно):\nuser: ghost\ntarget: nexus\nstatus: ready", "tests": [{"i": "", "o": "user: ghost\ntarget: nexus\nstatus: ready"}], "hint": "Три вызова print(), по одному на строку.", "theory": "print() каждый раз начинает новую строку. Тексты пиши в кавычках точно как в задании (с двоеточием и пробелом).", "scene": null}, {"lvl": "EASY", "title": "Площадь сервера", "desc": "Серверная комната - прямоугольник. Прочитай ширину и высоту (каждое на своей строке) и выведи площадь.", "tests": [{"i": "3\n4", "o": "12"}, {"i": "10\n7", "o": "70"}, {"i": "1\n1", "o": "1"}], "hint": "Площадь = ширина * высота.", "theory": "input() читает строку, превращай её в число: int(input()). Два числа читаются двумя вызовами. Перемножь их и выведи.", "scene": null}, {"lvl": "EASY", "title": "Таймер бомбы", "desc": "Таймер защиты показывает n минут. Прочитай n и выведи, сколько это секунд.", "tests": [{"i": "2", "o": "120"}, {"i": "10", "o": "600"}, {"i": "0", "o": "0"}], "hint": "В минуте 60 секунд.", "theory": "int(input()) даёт число минут. Умножь его на 60 и выведи через print().", "scene": null}, {"lvl": "EASY", "title": "Остаток доступа", "desc": "Система выдаёт a попыток порциями по b. Прочитай a и b (по одному на строке) и выведи остаток от деления a на b.", "tests": [{"i": "10\n3", "o": "1"}, {"i": "7\n7", "o": "0"}, {"i": "5\n9", "o": "5"}], "hint": "Остаток от деления даёт оператор %.", "theory": "Оператор % возвращает остаток: 10 % 3 = 1. Прочитай a и b и выведи a % b.", "scene": null}, {"lvl": "EASY", "title": "Радиоперехват", "desc": "Перехвачена радиограмма. Прочитай строку и выведи, сколько в ней слов (слова разделены пробелами).", "tests": [{"i": "attack at dawn", "o": "3"}, {"i": "hello", "o": "1"}, {"i": "one two three four five", "o": "5"}, {"i": "go go go", "o": "3"}], "hint": "split() режет строку на список слов, len() считает элементы.", "theory": "input().split() превращает строку в список слов. Длина списка len(...) и есть количество слов.", "scene": {"url": "https://shadowmail.onion/inbox", "head": "ШЕДОУМЕЙЛ // анонимная почта", "text": "Инсайдер оставил радиограмму. Сколько в ней слов? Это пароль к ящику."}}, {"lvl": "EASY", "title": "Крик в эфир", "desc": "Сообщение нужно передать капсом. Прочитай строку и выведи её заглавными буквами.", "tests": [{"i": "hello world", "o": "HELLO WORLD"}, {"i": "ghost", "o": "GHOST"}, {"i": "Nexus Corp", "o": "NEXUS CORP"}], "hint": "У строк есть метод .upper().", "theory": "Методы строк вызываются через точку: s.upper() возвращает копию строки заглавными буквами.", "scene": null}, {"lvl": "EASY", "title": "Средняя нагрузка", "desc": "Три сервера загружены на a, b и c процентов (по числу на строке). Выведи среднее, отбросив дробную часть.", "tests": [{"i": "10\n20\n30", "o": "20"}, {"i": "1\n2\n2", "o": "1"}, {"i": "100\n100\n99", "o": "99"}], "hint": "Целочисленное деление делается оператором //.", "theory": "Сложи три числа в скобках и раздели оператором //. Он отбрасывает дробную часть: 7 // 2 = 3.", "scene": null}, {"lvl": "EASY", "title": "Эхо-ловушка", "desc": "Ловушка повторяет слово n раз подряд без пробелов. Прочитай слово, затем n (на следующей строке) и выведи повтор.", "tests": [{"i": "ab\n3", "o": "ababab"}, {"i": "x\n5", "o": "xxxxx"}, {"i": "hack\n1", "o": "hack"}], "hint": "Строку можно умножить на число: 'ab' * 2.", "theory": "Умножение строки на число повторяет её: 'ab' * 3 это 'ababab'. Не забудь int() для n.", "scene": null}, {"lvl": "EASY", "title": "Знак сигнала", "desc": "Прочитай число. Выведи positive, если оно больше нуля, negative, если меньше, и zero, если равно нулю.", "tests": [{"i": "5", "o": "positive"}, {"i": "-3", "o": "negative"}, {"i": "0", "o": "zero"}, {"i": "100", "o": "positive"}], "hint": "Нужна цепочка if / elif / else.", "theory": "Проверяй условия по очереди: if n > 0: ... elif n < 0: ... else: ... После двоеточия нужен отступ в 4 пробела.", "scene": null}, {"lvl": "EASY", "title": "Клеймо пропуска", "desc": "На пропуске важны первая и последняя буквы имени. Прочитай слово (минимум 2 буквы) и выведи эти две буквы вместе.", "tests": [{"i": "ghost", "o": "gt"}, {"i": "ab", "o": "ab"}, {"i": "python", "o": "pn"}], "hint": "s[0] - первая буква, s[-1] - последняя.", "theory": "Индексы строки начинаются с 0. Отрицательный индекс считает с конца: s[-1] это последний символ.", "scene": {"url": "https://intranet.nexus.corp/pass", "head": "NEXUS INTRANET // пропускная система", "text": "Пропуск выдают по первой и последней букве имени. Введи их как код."}}, {"lvl": "MEDIUM", "title": "Счастливые порты", "desc": "Строка с номерами портов (числа через пробел). Выведи, сколько из них делится на 7.", "tests": [{"i": "7 14 3", "o": "2"}, {"i": "1 2 3", "o": "0"}, {"i": "49 50 56 70", "o": "3"}, {"i": "0 7", "o": "2"}], "hint": "Для каждого числа проверь x % 7 == 0.", "theory": "Превращай слова в числа: map(int, input().split()). Считай в цикле: if x % 7 == 0: count += 1. Ноль тоже делится на 7.", "scene": null}, {"lvl": "MEDIUM", "title": "Чётная добыча", "desc": "Строка с числами через пробел. Выведи сумму только чётных чисел.", "tests": [{"i": "1 2 3 4", "o": "6"}, {"i": "5 7 9", "o": "0"}, {"i": "10 -2 3 8", "o": "16"}, {"i": "0", "o": "0"}], "hint": "Чётное число: x % 2 == 0.", "theory": "Заведи total = 0 и в цикле по числам добавляй только те, у которых x % 2 == 0.", "scene": null}, {"lvl": "MEDIUM", "title": "Разворот слов", "desc": "Охрана читает каждое слово задом наперёд, но порядок слов не меняется: abc def -> cba fed.", "tests": [{"i": "hello world", "o": "olleh dlrow"}, {"i": "abc", "o": "cba"}, {"i": "ghost in the shell", "o": "tsohg ni eht llehs"}], "hint": "Разверни каждое слово срезом [::-1] и склей обратно через ' '.join().", "theory": "split() даёт слова, w[::-1] разворачивает слово, ' '.join(список) склеивает слова обратно через пробел.", "scene": null}, {"lvl": "MEDIUM", "title": "Цифровой след", "desc": "В строке букв и цифр посчитай, сколько в ней именно цифр.", "tests": [{"i": "a1b2c3", "o": "3"}, {"i": "hello", "o": "0"}, {"i": "2024", "o": "4"}, {"i": "x9 y8", "o": "2"}], "hint": "У символов есть метод .isdigit().", "theory": "c.isdigit() даёт True, если символ цифра. Пройди по символам строки и считай подходящие.", "scene": null}, {"lvl": "MEDIUM", "title": "Проверка пароля", "desc": "Пароль сильный (strong), если в нём не меньше 8 символов, есть хотя бы одна цифра и хотя бы одна заглавная буква. Иначе выведи weak.", "tests": [{"i": "Passw0rdX", "o": "strong"}, {"i": "password", "o": "weak"}, {"i": "SHORT1a", "o": "weak"}, {"i": "LongPassword", "o": "weak"}, {"i": "Ghost2031Nx", "o": "strong"}], "hint": "Нужны три условия сразу: len, any(isdigit), any(isupper).", "theory": "any(условие for c in s) даёт True, если хотя бы один символ подходит. Объедини три проверки словом and.", "scene": {"url": "app://cryptovault/unlock", "head": "CRYPTOVAULT 3.1 // приложение-сейф", "text": "Сейф паролей сотрудников. Введи вердикт анализатора (strong или weak) для пароля ниже."}}, {"lvl": "MEDIUM", "title": "Високосный год", "desc": "Год в архиве високосный, если он делится на 4, но не на 100, либо делится на 400. Прочитай год и выведи yes или no.", "tests": [{"i": "2024", "o": "yes"}, {"i": "1900", "o": "no"}, {"i": "2000", "o": "yes"}, {"i": "2023", "o": "no"}], "hint": "Проверь три деления: на 4, на 100 и на 400.", "theory": "Условие: (y % 4 == 0 and y % 100 != 0) or y % 400 == 0. Скобки помогают не запутаться.", "scene": null}, {"lvl": "MEDIUM", "title": "Разброс задержек", "desc": "Строка с задержками (числа через пробел). Выведи через пробел наименьшее и наибольшее число.", "tests": [{"i": "3 1 2", "o": "1 3"}, {"i": "5", "o": "5 5"}, {"i": "-4 10 0 7", "o": "-4 10"}], "hint": "Функции min() и max() принимают список.", "theory": "Сделай список чисел: list(map(int, ...)). print(min(a), max(a)) выведет два числа через пробел.", "scene": null},
